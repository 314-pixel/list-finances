<script>
'use strict';
const DB_KEY='list-finances-v1';
const COLORS=['#8c8af1','#7ccfbc','#f5af79','#ef859d','#8ca9f0','#b5a0db','#a7b9ca','#e4bf6a','#90bd9b','#d3a1ad'];
const EMOJI=['🛒','🏠','🚕','🧾','🩺','🎬','📚','☕','💳','🧳','🐾','🎁','💼','💰','🌿','🍜','🚗','✈️','👕','⚡','📦','🏦','⭐'];
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',plan:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 10h18m-12 5h6"/>',analytics:'<path d="M4 20V12m6 8V5m6 15v-9m4 9V8"/>',settings:'<path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/>',upload:'<path d="M12 17V5m-5 5 5-5 5 5M4 17v3h16v-3"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',chevron:'<path d="m9 18 6-6-6-6"/>',pen:'<path d="m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20Z"/>',trash:'<path d="M4 7h16m-13 0 1 14h8l1-14M9 4h6"/>'};
const ico=(key)=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.plus}</svg>`;
const id=()=> 'f'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now());
const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moneyValue=x=>Math.round((Number(x)||0)*100)/100;
const localDate=(d=new Date())=>{const yy=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${yy}-${mm}-${dd}`};
const dateFrom=s=>new Date(`${s}T12:00:00`);
const isValidDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')))return false;const d=dateFrom(s);return !Number.isNaN(d.getTime())&&localDate(d)===s};
const utcDay=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const dayDiff=(a,b)=>Math.round((utcDay(b)-utcDay(a))/86400000);
const plusDay=s=>new Date(utcDay(s)+86400000).toISOString().slice(0,10);
const monthKey=(d=new Date())=>localDate(new Date(d.getFullYear(),d.getMonth(),1)).slice(0,7);
const months=(key,delta)=>{let [y,m]=key.split('-').map(Number);return monthKey(new Date(y,m-1+delta,1))};
const monthLabel=key=>{const [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
const shortDate=s=>dateFrom(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const formatDate=s=>dateFrom(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const currencySymbol=()=>({RUB:'₽',EUR:'€',USD:'$',KZT:'₸',BYN:'Br',UAH:'₴'})[db.settings.currency]||'₽';
const fmt=(n,opts={})=>{const v=Number(n)||0;return `${new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:opts.fixed?2:0}).format(v)} ${currencySymbol()}`};
const fmtShort=n=>{let a=Math.abs(n);return (a>=1e6?`${(n/1e6).toFixed(1)}м`:a>=1e3?`${(n/1e3).toFixed(a>=10000?0:1)}к`:Number(n).toFixed(0))};
const parseMoney=(x)=>{const n=Number(String(x||'').replace(',','.'));return Number.isFinite(n)?moneyValue(n):NaN};
function defaults(){return {version:1,settings:{currency:'RUB',theme:'system',aiEndpoint:''},accounts:[{id:'acc-cash',name:'Наличные',type:'cash',initial:0,color:'#8c8af1'}],categories:[
{id:'c-groceries',name:'Продукты',type:'expense',emoji:'🛒',color:'#7ccfbc'},{id:'c-home',name:'Дом',type:'expense',emoji:'🏠',color:'#8c8af1'},{id:'c-transport',name:'Транспорт',type:'expense',emoji:'🚕',color:'#f5af79'},{id:'c-shopping',name:'Покупки',type:'expense',emoji:'🛍️',color:'#ef859d'},{id:'c-health',name:'Здоровье',type:'expense',emoji:'🩺',color:'#90bd9b'},{id:'c-leisure',name:'Досуг',type:'expense',emoji:'🎬',color:'#b5a0db'},{id:'c-bills',name:'Платежи',type:'expense',emoji:'🧾',color:'#e4bf6a'},{id:'c-other',name:'Другое',type:'expense',emoji:'📦',color:'#a7b9ca'},
{id:'i-salary',name:'Зарплата',type:'income',emoji:'💼',color:'#7ccfbc'},{id:'i-gift',name:'Подарки',type:'income',emoji:'🎁',color:'#e4bf6a'},{id:'i-other',name:'Прочие доходы',type:'income',emoji:'💰',color:'#b5a0db'}],transactions:[],budgets:[],goals:[],recurring:[]}}
function validateDb(raw){if(!raw||typeof raw!=='object'||raw.version!==1||!raw.settings||!Array.isArray(raw.accounts)||!Array.isArray(raw.categories)||!Array.isArray(raw.transactions)||!Array.isArray(raw.budgets)||!Array.isArray(raw.goals)||!Array.isArray(raw.recurring))throw Error('Неверный формат резервной копии');if(raw.accounts.length<1||raw.accounts.length>300||raw.transactions.length>200000||raw.categories.length>300||raw.budgets.length>300||raw.goals.length>500||raw.recurring.length>500)throw Error('Недопустимый размер данных');const str=(v,max=160)=>String(v??'').slice(0,max);const amt=v=>{const n=Number(v);if(!Number.isFinite(n)||Math.abs(n)>1e13)throw Error('Некорректная сумма');return moneyValue(n)};const uniq=(arr)=>{const ids=new Set();for(const x of arr){if(ids.has(x.id))throw Error('Повторяющиеся идентификаторы');ids.add(x.id)}return arr};const accounts=uniq(raw.accounts.map(x=>({id:str(x.id,100),name:str(x.name,100),type:['cash','card','savings','debt'].includes(x.type)?x.type:'cash',initial:amt(x.initial),color:COLORS.includes(x.color)?x.color:COLORS[0],interestRate:x.type==='savings'&&Number.isFinite(Number(x.interestRate))?Math.max(0,Math.min(100,Number(x.interestRate))):0,interestStart:x.type==='savings'&&isValidDate(x.interestStart)?x.interestStart:''})));const categories=uniq(raw.categories.map(x=>({id:str(x.id,100),name:str(x.name,100),type:x.type==='income'?'income':'expense',emoji:str(x.emoji,8),color:COLORS.includes(x.color)?x.color:COLORS[0]})));const goals=uniq(raw.goals.map(x=>({id:str(x.id,100),name:str(x.name,100),target:amt(x.target),deadline:/^\d{4}-\d{2}-\d{2}$/.test(x.deadline||'')?x.deadline:'',emoji:str(x.emoji||'🎯',8),color:COLORS.includes(x.color)?x.color:COLORS[0],archived:x.archived===true})));const acctIds=new Set(accounts.map(x=>x.id)),catIds=new Set(categories.map(x=>x.id)),catTypes=Object.fromEntries(categories.map(x=>[x.id,x.type])),goalIds=new Set(goals.map(x=>x.id));const transactions=uniq(raw.transactions.map(x=>{const t={id:str(x.id,100),type:str(x.type,20),amount:amt(x.amount),date:str(x.date,10),note:str(x.note,250),accountId:str(x.accountId,100),categoryId:str(x.categoryId,100),toAccountId:str(x.toAccountId,100),goalId:str(x.goalId,100),recurringId:str(x.recurringId||'',100),interestRecord:x.interestRecord===true,interestPeriodStart:isValidDate(x.interestPeriodStart)?x.interestPeriodStart:'',interestPeriodEnd:isValidDate(x.interestPeriodEnd)?x.interestPeriodEnd:''};if(!['expense','income','transfer','goalAdd','goalTake'].includes(t.type)||t.amount<=0||!isValidDate(t.date)||!acctIds.has(t.accountId))throw Error('Некорректная операция');if(['expense','income'].includes(t.type)&&catTypes[t.categoryId]!==t.type)throw Error('Категория операции не найдена');if(t.type==='transfer'&&(!acctIds.has(t.toAccountId)||t.accountId===t.toAccountId))throw Error('Ошибка перевода');if(['goalAdd','goalTake'].includes(t.type)&&!goalIds.has(t.goalId))throw Error('Цель не найдена');return t}));const budgets=uniq(raw.budgets.map(x=>({id:str(x.id,100),categoryId:str(x.categoryId,100),limit:amt(x.limit),monthLimits:Object.fromEntries(Object.entries(x.monthLimits&&typeof x.monthLimits==='object'&&!Array.isArray(x.monthLimits)?x.monthLimits:{}).filter(([k,v])=>/^\d{4}-(0[1-9]|1[0-2])$/.test(k)&&Number.isFinite(Number(v))&&Number(v)>0&&Number(v)<=1e13).slice(0,240).map(([k,v])=>[k,amt(v)]))}))).filter(x=>catIds.has(x.categoryId)&&x.limit>0);const recurring=uniq(raw.recurring.map(x=>({id:str(x.id,100),title:str(x.title,100),type:x.type==='income'?'income':'expense',amount:amt(x.amount),accountId:str(x.accountId,100),categoryId:str(x.categoryId,100),interval:['weekly','monthly','yearly'].includes(x.interval)?x.interval:'monthly',nextDate:str(x.nextDate,10),anchorDay:Math.min(31,Math.max(1,Number(x.anchorDay)||Number(String(x.nextDate).slice(8))||1)),active:x.active!==false}))).filter(x=>acctIds.has(x.accountId)&&catTypes[x.categoryId]===x.type&&isValidDate(x.nextDate)&&x.amount>0);return {version:1,settings:{currency:['RUB','EUR','USD','KZT','BYN','UAH'].includes(raw.settings.currency)?raw.settings.currency:'RUB',theme:['light','dark','system'].includes(raw.settings.theme)?raw.settings.theme:'system',aiEndpoint:validAiUrl(raw.settings.aiEndpoint||'')?String(raw.settings.aiEndpoint).trim():''},accounts,categories,transactions,budgets,goals,recurring}}
let db;let storageError='';try{const str=localStorage.getItem(DB_KEY);db=str?validateDb(JSON.parse(str)):defaults()}catch(e){db=defaults();storageError='Не удалось прочитать локальные данные. Проверьте хранилище браузера; исходные данные не перезаписываются.'}
const ui={tab:'home',month:monthKey(),planTab:'budgets',historyType:'all',historyMonth:'all',search:'',chartType:'expense',aiConsent:false};
function save(){if(storageError){return false}try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){return false}}
function commit(message){const ok=save();render();if(ok&&message)toast(message);if(!ok)toast('Не удалось сохранить на устройство! Экспортируйте JSON сейчас.')}
function theme(){document.documentElement.dataset.theme=db.settings.theme==='system'?'':db.settings.theme;document.getElementById('theme-color').content=db.settings.theme==='dark'?'#11151e':'#eff1f6'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),3300)}
const acct=aid=>db.accounts.find(a=>a.id===aid);
const cat=cid=>db.categories.find(c=>c.id===cid);
const goal=gid=>db.goals.find(g=>g.id===gid);
const recur=rid=>db.recurring.find(r=>r.id===rid);
function accountBalance(a){return moneyValue(a.initial+db.transactions.reduce((sum,t)=>{if(t.date>localDate())return sum;if(t.type==='income'&&t.accountId===a.id)return sum+t.amount;if(t.type==='expense'&&t.accountId===a.id)return sum-t.amount;if(t.type==='transfer')return sum+(t.toAccountId===a.id?t.amount:0)-(t.accountId===a.id?t.amount:0);if(t.type==='goalAdd'&&t.accountId===a.id)return sum-t.amount;if(t.type==='goalTake'&&t.accountId===a.id)return sum+t.amount;return sum},0))}
function goalBalance(g,excludedId=''){return moneyValue(db.transactions.reduce((sum,t)=>t.id===excludedId||t.date>localDate()?sum:t.goalId===g.id?sum+(t.type==='goalAdd'?t.amount:t.type==='goalTake'?-t.amount:0):sum,0))}
function accountDelta(t,aid){if(t.type==='income'&&t.accountId===aid)return t.amount;if(t.type==='expense'&&t.accountId===aid)return -t.amount;if(t.type==='transfer')return (t.toAccountId===aid?t.amount:0)-(t.accountId===aid?t.amount:0);if(t.type==='goalAdd'&&t.accountId===aid)return -t.amount;if(t.type==='goalTake'&&t.accountId===aid)return t.amount;return 0}
function estimateInterest(a,until=localDate()){
  if(!a||a.type!=='savings'||!(a.interestRate>0)||!isValidDate(a.interestStart)||!isValidDate(until)||a.interestStart>=until)return 0;
  const daily=new Map();let balance=a.initial;
  for(const t of db.transactions){const delta=accountDelta(t,a.id);if(!delta||t.date>=until)continue;if(t.date<a.interestStart)balance+=delta;else daily.set(t.date,(daily.get(t.date)||0)+delta)}
  let interest=0;let cursor=a.interestStart;
  while(cursor<until){balance+=daily.get(cursor)||0;interest+=Math.max(0,balance)*a.interestRate/36500;cursor=plusDay(cursor)}
  return moneyValue(interest);
}
function savingsProjection(a){const balance=Math.max(0,accountBalance(a));return moneyValue(balance*(a.interestRate||0)*30/36500)}
function budgetLimit(b,key=ui.month){return b.monthLimits&&Object.prototype.hasOwnProperty.call(b.monthLimits,key)?b.monthLimits[key]:b.limit}
function bookInterest(aid){const a=acct(aid);if(!a||a.type!=='savings'||!(a.interestRate>0))return toast('Сначала задайте ставку накопительного счёта');const today=localDate();const amount=estimateInterest(a,today);if(amount<0.01)return toast('Пока нет рассчитанных процентов для начисления');const exists= db.categories.find(c=>c.id==='i-interest');if(exists&&exists.type!=='income')return toast('Категория процентов занята другим типом. Проверьте данные.');const entered=prompt(`Оценка процентов: ${fmt(amount)}. Введите фактически зачисленную банком сумму (при необходимости измените оценку):`,String(amount));if(entered===null)return;const actual=parseMoney(entered);if(!Number.isFinite(actual)||actual<0.01||actual>1e13)return toast('Введите корректную сумму начисления');if(!confirm(`Учесть доход ${fmt(actual)} на счёт «${a.name}» и начать следующий период расчёта с ${today}?`))return;
  if(!exists)db.categories.push({id:'i-interest',name:'Проценты',type:'income',emoji:'🏦',color:COLORS[1]});
  db.transactions.push({id:id(),type:'income',amount:actual,date:today,note:'Проценты по накопительному счёту (ввод по выписке)',accountId:a.id,categoryId:'i-interest',toAccountId:'',goalId:'',recurringId:'',interestRecord:true,interestPeriodStart:a.interestStart,interestPeriodEnd:today});a.interestStart=today;closeModal();commit('Проценты учтены в доходах');
}

const now=localDate();const within=new Date();within.setDate(within.getDate()+7);const end=localDate(within);const due=db.recurring.filter(r=>r.active&&r.nextDate<=end);if(due.length)insights.push({icon:'◷',title:'Ближайшие регулярные платежи',text:`${due.length} запланировано до ${shortDate(end)}. Учитываются вручную в разделе «План».`});

function validAiUrl(value){try{const u=new URL(String(value||''));return u.protocol==='https:'&&u.username===''&&u.password===''&&u.search===''&&u.hash===''&&u.hostname.endsWith('.workers.dev')&&u.pathname==='/'&&u.href.length<240}catch{return false}}

function aiSection(){const configured=validAiUrl(db.settings.aiEndpoint);return `${section('ИИ-анализ · по запросу')}<div class="card ai-card"><div class="card-head"><div><div class="card-title">Финансовый разбор с ИИ</div><div class="card-caption">${configured?'Подключение настроено · запрос только с вашего согласия':'Не подключено · настройте безопасный сервер'}</div></div><span class="ai-status ${configured?'ready':''}">${configured?'Онлайн':'Не настроено'}</span></div><p class="note">ИИ получает только агрегированные суммы, категории расходов и лимиты за выбранный месяц, ставки и агрегаты по накоплениям. Без имён счетов, заметок и истории отдельных платежей. Данные отправляются вашему Cloudflare Worker и поставщику ИИ; локальные подсказки работают без сети.</p>${configured?`<label class="ai-consent"><input id="ai-consent" type="checkbox" ${ui.aiConsent?'checked':''}><span>Согласен на передачу перечисленных агрегированных данных для этого запроса.</span></label><button class="button primary wide" data-action="request-ai" ${aiBusy?'disabled':''}>${aiBusy?'Идёт анализ…':'Получить персональный ИИ-анализ'}</button>`:`<button class="button soft wide" data-action="go-settings">Настроить ИИ в разделе «Ещё»</button>`}${aiError?`<p class="warning-note" role="alert">${esc(aiError)}</p>`:''}${aiResponse?`<div class="ai-answer" aria-live="polite"><div class="card-title">Рекомендации ИИ</div><div class="ai-answer-body">${esc(aiResponse)}</div><p class="note">Автоматическая оценка по вашим данным, не банковская и не инвестиционная консультация.</p></div>`:''}</div>`}
async function requestAi(){
  if(aiBusy)return;
  const endpoint=db.settings.aiEndpoint;
  if(!validAiUrl(endpoint)){toast('Сначала настройте адрес Cloudflare Worker');return}
  if(!ui.aiConsent){toast('Подтвердите согласие на передачу агрегированных данных');return}
  if(!navigator.onLine){toast('Для ИИ-анализа нужен интернет. Локальные советы доступны ниже.');return}
  if(!aiSessionToken){const token=prompt('Введите личный ключ доступа к вашему ИИ-прокси (ACCESS_TOKEN). Он останется только в памяти до закрытия приложения:');if(!token)return;aiSessionToken=token.trim();}
  aiBusy=true;aiError='';aiResponse='';render();const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),30000);
  try{
    const response=await fetch(endpoint,{method:'POST',mode:'cors',cache:'no-store',headers:{'content-type':'application/json','authorization':`Bearer ${aiSessionToken}`},body:JSON.stringify({consent:true,summary:aiSnapshot()}),signal:ctrl.signal});
    if(response.status===401||response.status===403){aiSessionToken='';throw Error('Неверный ключ доступа или запрещённый источник. Проверьте настройки Worker.');}
    if(!response.ok)throw Error('Сервис ИИ вернул HTTP '+response.status);
    const payload=await response.json();if(typeof payload.advice!=='string'||payload.advice.length>10000)throw Error('Некорректный ответ сервиса');aiResponse=payload.advice.slice(0,7000);
  }catch(e){aiError=e.name==='AbortError'?'Сервис не ответил за 30 секунд.':'ИИ недоступен: '+String(e.message||e).slice(0,160)}finally{clearTimeout(timeout);aiBusy=false;ui.aiConsent=false;render()}
}

function transactionForm(editId='',forcedType='expense',forcedGoal=''){const existing=db.transactions.find(x=>x.id===editId);if(existing?.interestRecord){modal('Учтённые проценты','interestInfo',`<p class="notice">${esc(formatDate(existing.date))} · ${fmt(existing.amount)}. Это начисление создано из расчёта процентной ставки. Для исправления удалите его и повторите начисление из счёта.</p><div class="sheet-actions"><button type="button" class="button danger" data-action="delete-transaction" data-id="${esc(editId)}">Удалить начисление</button><button type="button" class="button soft" data-action="close-modal">Закрыть</button></div>`);return;}const t=existing||{type:forcedType,amount:'',date:localDate(),note:'',accountId:db.accounts[0]?.id,categoryId:'',toAccountId:db.accounts[1]?.id||db.accounts[0]?.id,goalId:forcedGoal};let type=t.type;const opts=[['expense','Расход'],['income','Доход'],['transfer','Перевод между счетами'],['goalAdd','Пополнение цели'],['goalTake','Вывод из цели']];const body=`${selectField('Тип операции','type',opts.map(([id,label])=>({id,label})),type)}<div class="form-grid">${moneyField('Сумма','amount',t.amount)}<label class="field"><span>Дата</span><input name="date" type="date" required value="${esc(t.date)}"></label></div>${selectField('Счёт','accountId',accountOpts(),t.accountId)}<div id="transaction-category-wrap">${selectField('Категория','categoryId',catOpts(type==='income'?'income':'expense'),t.categoryId)}</div><div id="transaction-to-wrap" class="hidden">${selectField('Счёт назначения','toAccountId',accountOpts(),t.toAccountId)}</div><div id="transaction-goal-wrap" class="hidden">${selectField('Цель','goalId',goalOpts(),t.goalId)}</div><label class="field"><span>Заметка (необязательно)</span><input name="note" maxlength="250" value="${esc(t.note)}" placeholder="Что это за операция?"></label><div class="notice" id="transaction-hint"></div>${saveButtons(editId,'transaction')}`;modal(editId?'Изменить операцию':'Новая операция','transactio function syncTransactionFields(){const form=document.getElementById('edit-form');if(!form||form.dataset.kind!=='transaction')return;const type=form.elements.type.value,categoryWrap=document.getElementById('transaction-category-wrap'),toWrap=document.getElementById('transaction-to-wrap'),goalWrap=document.getElementById('transaction-goal-wrap');const isNormal=['expense','income'].includes(type);categoryWrap.classList.toggle('hidden',!isNormal);toWrap.classList.toggle('hidden',type!=='transfer');goalWrap.classList.toggle('hidden',!type.startsWith('goal'));if(isNormal){const desired=type==='income'?'income':'expense',current=form.elements.categoryId.value;const options=catOpts(desired);if(!options.some(o=>o.id===current)){categoryWrap.innerHTML=selectField('Категория','categoryId',options,options[0]?.id)}}const hints={expense:'Сумма будет списана с выбранного счёта.',income:'Сумма поступит на выбранный счёт.',transfer:'Деньги переместятся между счетами. Доходы и расходы не изменятся.',goalAdd:'Сумма перейдёт со счёта в выбранную цель — это не расход.',goalTake:'Сумма вернётся из цели на счёт — это не доход.'};document.getElementById('transaction-hint').textContent=hints[type];}

function syncRecurringFields(){const f=document.getElementById('edit-form');if(!f||f.dataset.kind!=='recurring')return;const wrap=document.getElementById('recurring-category-wrap');wrap.innerHTML=selectField('Категория','categoryId',catOpts(f.elements.type.value),catOpts(f.elements.type.value)[0]?.id)}
function assert(cond,msg){if(!cond)throw Error(msg)}
function readForm(form){const raw=Object.fromEntries(new FormData(form));return raw}
function formSubmit(form){const x=readForm(form),oldId=form.dataset.id,kind=form.dataset.kind;try{
if(kind==='transaction'){const old=db.transactions.find(t=>t.id===oldId),type=x.type,amount=parseMoney(x.amount);assert(Number.isFinite(amount)&&amount>0,'Введите сумму больше нуля');assert(isValidDate(x.date),'Укажите дату');assert(x.date<=localDate(),'Будущие операции планируйте через регулярные платежи');assert(acct(x.accountId),'Выберите счёт');const t={id:old?.id||id(),type,amount,date:x.date,note:String(x.note||'').trim().slice(0,250),accountId:x.accountId,categoryId:'',toAccountId:'',goalId:'',recurringId:old?.recurringId||''};if(type==='expense'||type==='income'){assert(cat(x.categoryId)?.type===type,'Укажите категорию');t.categoryId=x.categoryId}else if(type==='transfer'){assert(acct(x.toAccountId)&&x.toAccountId!==x.accountId,'Выберите другой счёт для перевода');t.toAccountId=x.toAccountId}else if(type==='goalAdd'||type==='goalTake'){assert(goal(x.goalId)&&!goal(x.goalId).archived,'Выберите цель');t.goalId=x.goalId;const available=goalBalance(goal(x.goalId),oldId);assert(type!=='goalTake'||amount<=available,'В цели недостаточно накоплений')}else throw Error('Неизвестный тип операции');if(old?.type==='goalAdd'&&old.goalId!==t.goalId||old?.type==='goalAdd'&&t.amount<old.amount||old?.type==='goalAdd'&&t.type!=='goalAdd'){const orig=goal(old.goalId);if(orig){const future=goalBalance(orig,oldId)+(t.type==='goalAdd'&&t.goalId===orig.id?t.amount:0)-(t.type==='goalTake'&&t.goalId===orig.id?t.amount:0);assert(future>=0,'Изменение оставит цель с отрицательным остатком')}}if(old){db.transactions=db.transactions.map(v=>v.id===oldId?t:v)}else db.transactions.push(t);closeModal();commit(old?'Операция обновлена':'Операция добавлена');return}
if(kind==='account'){const initial=parseMoney(x.initial);assert(x.name?.trim(),'Укажите название');assert(Number.isFinite(initial)&&Math.abs(initial)<1e13,'Введите корректный баланс');assert(['savings','card','cash','debt'].includes(x.type),'Неизвестный тип счёта');const old=acct(oldId);const rate=x.type==='savings'?Number(String(x.interestRate||0).replace(',','.')):0;assert(Number.isFinite(rate)&&rate>=0&&rate<=100,'Ставка должна быть от 0 до 100%');const start=x.type==='savings'&&rate>0?(x.interestStart||localDate()):'';assert(!start||isValidDate(start),'Некорректная дата начала начисления');if(start){const periods=db.transactions.filter(t=>t.interestRecord&&t.accountId===oldId&&isValidDate(t.interestPeriodEnd)).map(t=>t.interestPeriodEnd).sort();if(periods.length)assert(start>=periods[periods.length-1],'Дата расчёта не может быть раньше уже учтённых процентов')}if(old&&old.type==='savings'&&old.interestRate!==rate&&estimateInterest(old)>=0.01&&!confirm('Изменение ставки пересчитает ещё не учтённые проценты с новой даты. Сначала можно учесть текущие проценты. Продолжить?'))return;const a={id:oldId||id(),name:x.name.trim().slice(0,100),type:x.type,initial,color:x.color,interestRate:rate,interestStart:start};if(oldId)db.accounts=db.accounts.map(v=>v.id===oldId?a:v);else db.accounts.push(a);closeModal();commit('Счёт сохранён');return}
if(kind==='category'){assert(x.name?.trim(),'Укажите название');const c={id:oldId||id(),name:x.name.trim().slice(0,100),type:x.type,emoji:x.emoji||'📦',color:x.color};if(oldId)db.categories=db.categories.map(v=>v.id===oldId?c:v);else db.categories.push(c);closeModal();commit('Категория сохранена');return}
if(kind==='budget'){const limit=parseMoney(x.limit);assert(limit>0&&Number.isFinite(limit),'Укажите положительный лимит');assert(cat(x.categoryId)?.type==='expense','Выберите категорию расходов');const match=db.budgets.find(b=>b.categoryId===x.categoryId&&b.id!==oldId);assert(!match,'Для этой категории уже существует бюджет');assert(['month','all'].includes(x.scope),'Выберите период');const prior=db.budgets.find(b=>b.id===oldId);const b={id:oldId||id(),categoryId:x.categoryId,limit:prior?.limit||limit,monthLimits:{...(prior?.monthLimits||{})}};if(x.scope==='month')b.monthLimits[ui.month]=limit;else b.limit=limit;if(oldId)db.budgets=db.budgets.map(v=>v.id===oldId?b:v);else db.budgets.push(b);closeModal();commit('Бюджет сохранён');return}
if(kind==='goal'){const target=parseMoney(x.target);assert(x.name?.trim(),'Укажите название цели');assert(target>0&&Number.isFinite(target),'Укажите положительную сумму');const g={id:oldId||id(),name:x.name.trim().slice(0,100),target,deadline:x.deadline||'',emoji:x.emoji||'🎯',color:x.color,archived:goal(oldId)?.archived||false};if(oldId)db.goals=db.goals.map(v=>v.id===oldId?g:v);else db.goals.push(g);closeModal();commit('Цель сохранена');return}
if(kind==='recurring'){const amount=parseMoney(x.amount);assert(x.title?.trim(),'Укажите название');assert(amount>0&&Number.isFinite(amount),'Укажите сумму');assert(acct(x.accountId),'Выберите счёт');assert(cat(x.categoryId)?.type===x.type,'Выберите категорию');assert(isValidDate(x.nextDate),'Укажите дату');const r={id:oldId||id(),title:x.title.trim().slice(0,100),type:x.type,amount,accountId:x.accountId,categoryId:x.categoryId,interval:x.interval,nextDate:x.nextDate,anchorDay:Number(x.nextDate.slice(8)),active:x.active==='on'};if(oldId)db.recurring=db.recurring.map(v=>v.id===oldId?r:v);else db.recurring.push(r);closeModal();commit('Регулярная операция сохранена');return}}
catch(e){toast(e.message||'Ошибка сохранения')}}
function confirmDelete(kind,entityId){const obj=({transaction:()=>db.transactions.find(x=>x.id===entityId),account:()=>acct(entityId),category:()=>cat(entityId),budget:()=>db.budgets.find(x=>x.id===entityId),goal:()=>goal(entityId),recurring:()=>recur(entityId)})[kind]?.();if(!obj)return;const labels={transaction:'операцию',account:'счёт',category:'категорию',budget:'бюджет',goal:'цель',recurring:'регулярную операцию'};
if(kind==='account'){assertCanDeleteAccount(obj);if(db.accounts.length<=1){toast('Нужно оставить хотя бы один счёт');return}}
if(kind==='goal'){if(goalBalance(obj)!==0){toast('Сначала выведите все средства из цели');return}}
if(kind==='category'){const same=db.categories.filter(c=>c.type===obj.type&&c.id!==obj.id);if(!same.length){toast('Оставьте хотя бы одну категорию этого типа');return}}
if(kind==='transaction'&&obj.type==='goalAdd'&&goalBalance(goal(obj.goalId))<obj.amount){toast('Нельзя удалить: часть накоплений уже выведена');return}
if(!confirm(`Удалить ${labels[kind]}?${kind==='category'?' Связанные записи будут перенесены в другую категорию того же типа.':''}`))return;
if(kind==='transaction'&&obj.interestRecord&&acct(obj.accountId)?.interestStart!==obj.interestPeriodEnd){toast('Сначала удалите более поздние начисления процентов');return}if(kind==='transaction'){db.transactions=db.transactions.filter(t=>t.id!==entityId);if(obj.interestRecord){const a=acct(obj.accountId);if(a&&a.interestStart===obj.interestPeriodEnd&&isValidDate(obj.interestPeriodStart))a.interestStart=obj.interestPeriodStart}}
if(kind==='account'){db.accounts=db.accounts.filter(a=>a.id!==entityId)}
if(kind==='budget'){db.budgets=db.budgets.filter(b=>b.id!==entityId)}
if(kind==='recurring'){db.recurring=db.recurring.filter(r=>r.id!==entityId)}
if(kind==='goal'){if(db.transactions.some(t=>t.goalId===entityId)){db.goals=db.goals.map(g=>g.id===entityId?{...g,archived:true}:g)}else db.goals=db.goals.filter(g=>g.id!==entityId)}
if(kind==='category'){const fallback=db.categories.find(c=>c.type===obj.type&&c.id!==obj.id&&c.name.toLowerCase().includes('другое'))||db.categories.find(c=>c.type===obj.type&&c.id!==obj.id);db.transactions.forEach(t=>{if(t.categoryId===entityId)t.categoryId=fallback.id});db.recurring.forEach(r=>{if(r.categoryId===entityId)r.categoryId=fallback.id});db.budgets=db.budgets.filter(b=>b.categoryId!==entityId);db.categories=db.categories.filter(c=>c.id!==entityId)}closeModal();commit('Удалено')}
function assertCanDeleteAccount(a){const linked=db.transactions.some(t=>t.accountId===a.id||t.toAccountId===a.id)||db.recurring.some(r=>r.accountId===a.id);if(linked){toast('Счёт используется в истории или правилах. Сначала измените связанные записи.');return false}return true}
function nextDue(date,interval,anchorDay){const d=dateFrom(date);if(interval==='weekly'){d.setDate(d.getDate()+7)}else{const day=anchorDay||d.getDate(),delta=interval==='yearly'?12:1;d.setDate(1);d.setMonth(d.getMonth()+delta);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}return localDate(d)}
function applyRecurring(rid){const r=recur(rid);if(!r||!r.active)return; if(r.nextDate>localDate()){toast('Дата платежа ещё не наступила');return}db.transactions.push({id:id(),type:r.type,amount:r.amount,date:r.nextDate,note:r.title,accountId:r.accountId,categoryId:r.categoryId,toAccountId:'',goalId:'',recurringId:r.id});r.nextDate=nextDue(r.nextDate,r.interval,r.anchorDay);commit('Платёж добавлен в историю')}
function goTab(tab){ui.tab=tab;render();window.scrollTo({top:0,behavior:'instant'})}
function handleAction(button){const action=button.dataset.action,entityId=button.dataset.id;switch(action){case'tab':goTab(entityId);break;case'go-settings':goTab('settings');break;case'month-prev':ui.month=months(ui.month,-1);render();break;case'month-next':ui.month=months(ui.month,1);render();break;case'goto-plan':ui.planTab=entityId||'budgets';goTab('plan');break;case'plan-tab':ui.planTab=entityId;render();break;case'open-transaction':transactionForm();break;case'edit-transaction':transactionForm(entityId);break;case'goal-add':transactionForm('','goalAdd',entityId);break;case'goal-take':transactionForm('','goalTake',entityId);break;case'open-account':accountForm();break;case'book-interest':bookInterest(entityId);break;case'edit-account':accountForm(entityId);break;case'open-category':categoryForm();break;case'edit-category':categoryForm(entityId);break;case'open-budget':budgetForm();break;case'edit-budget':budgetForm(entityId);break;case'reset-month-budget':{const b=db.budgets.find(v=>v.id===entityId);if(b?.monthLimits&&Object.hasOwn(b.monthLimits,ui.month)){delete b.monthLimits[ui.month];closeModal();commit('Индивидуальный лимит сброшен')}break;}case'open-goal':goalForm();break;case'edit-goal':goalForm(entityId);break;case'open-recurring':recurringForm();break;case'edit-recurring':recurringForm(entityId);break;case'apply-recurring':applyRecurring(entityId);break;case'close-modal':closeModal();break;case'clear-filters':ui.historyType='all';ui.historyMonth='all';ui.search='';render();break;case'prepare-offline':prepareOffline(true);break;case'request-ai':requestAi();break;case'clear-ai-endpoint':db.settings.aiEndpoint='';aiSessionToken='';aiResponse='';ui.aiConsent=false;commit('ИИ отключён');break;case'export-json':exportJSON();break;case'export-csv':exportCSV();break;case'import-json':importJSON();break;case'load-demo':loadDemo();break;case'reset-all':resetAll();break;default:if(action?.startsWith('delete-')){const kind=action.slice(7);if(kind==='account'&&!assertCanDeleteAccount(acct(entityId)))return;confirmDelete(kind,entityId)}}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='modal-background'){if(e.target===btn)closeModal();return}handleAction(btn)});
document.addEventListener('submit',e=>{if(e.target.id==='edit-form'){e.preventDefault();formSubmit(e.target)}if(e.target.id==='ai-endpoint-form'){e.preventDefault();const url=String(new FormData(e.target).get('aiEndpoint')||'').trim();if(!validAiUrl(url)){toast('Нужен HTTPS-адрес вашего *.workers.dev без параметров');return;}if(!confirm('Этот адрес будет получать агрегированные финансовые показатели только после вашего отдельного согласия. Убедитесь, что Worker принадлежит вам.'))return;db.settings.aiEndpoint=url;aiSessionToken='';commit('Адрес ИИ-сервиса сохранён')}});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='type'&&t.closest('#edit-form')){const kind=t.closest('form').dataset.kind;if(kind==='transaction')syncTransactionFields();if(kind==='recurring')syncRecurringFields();if(kind==='account')syncAccountFields()}if(t.id==='tx-type'){ui.historyType=t.value;refreshHistory()}if(t.id==='tx-month'){ui.historyMonth=t.value||'all';refreshHistory()}if(t.id==='ai-consent'){ui.aiConsent=t.checked}if(t.id==='setting-currency'){if(confirm('Изменить валюту? Числовые значения НЕ конвертируются, изменится только символ.')){db.settings.currency=t.value;commit('Обозначение валюты изменено')}else t.value=db.settings.currency}if(t.id==='setting-theme'){db.settings.theme=t.value;commit('Оформление обновлено')}});
document.addEventListener('input',e=>{if(e.target.id==='tx-search'){ui.search=e.target.value;refreshHistory()}});
function refreshHistory(){const el=document.getElementById('history-list');if(el)el.innerHTML=historyRows();const count=document.getElementById('history-count');if(count)count.textContent=filteredHistory().length}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-backdrop'))closeModal()});
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download(`list-finances-${localDate()}.json`,JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('Резервная копия подготовлена. Сохраните её в «Файлы».')}
function exportCSV(){const rows=[['Дата','Тип','Сумма','Валюта','Счёт','Счёт назначения','Категория','Цель','Заметка']];sortedTx().forEach(t=>rows.push([t.date,t.type,String(t.amount),db.settings.currency,acct(t.accountId)?.name||'',acct(t.toAccountId)?.name||'',cat(t.categoryId)?.name||'',goal(t.goalId)?.name||'',t.note||'']));const csv='\uFEFF'+rows.map((row,i)=>row.map((cell,j)=>{let v=String(cell);if(i>0&&![0,2,3].includes(j)&&/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');download(`list-operations-${localDate()}.csv`,csv,'text/csv;charset=utf-8');toast('CSV подготовлен для сохранения')}
function importJSON(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{if(!input.files?.length)return;try{const text=await input.files[0].text();assert(text.length<35e6,'Файл слишком большой');const imported=validateDb(JSON.parse(text));if(!confirm(`Заменить все текущие данные? В файле ${imported.transactions.length} операций. Сначала сохраните резервную копию текущих данных.`))return;const previous=db,previousError=storageError;db=imported;storageError='';if(!save()){db=previous;storageError=previousError;toast('Импорт не записан: хранилище недоступно');return}ui.month=monthKey();closeModal();goTab('home');toast('Данные восстановлены')}catch(e){toast('Не удалось импортировать: '+e.message)}};input.click()}
function loadDemo(){if(db.transactions.length||db.goals.length||db.budgets.length||db.recurring.length){toast('Демоданные можно загрузить только в пустой дневник');return}if(!confirm('Добавить примерные операции и планы? Это вымышленные суммы.'))return;const today=localDate(),key=monthKey();const mk=(offset)=>{const base=new Date();base.setDate(base.getDate()-offset);return localDate(base)};const a=db.accounts[0];a.name='Основная карта';a.type='card';a.initial=85000;const ops=[['income',95000,'i-salary','Зарплата',23],['expense',4500,'c-groceries','Супермаркет',1],['expense',1650,'c-transport','Такси',2],['expense',8200,'c-shopping','Одежда',3],['expense',2900,'c-leisure','Кино и ужин',5],['expense',3600,'c-groceries','Покупки на неделю',7],['expense',28000,'c-home','Аренда квартиры',9],['expense',1900,'c-bills','Интернет',12],['income',7000,'i-other','Подработка',13],['expense',1200,'c-health','Аптека',18],['income',95000,'i-salary','Зарплата',52],['expense',38000,'c-home','Жильё и коммунальные',46],['expense',12400,'c-groceries','Продукты',44],['expense',6000,'c-transport','Транспорт',39]];db.transactions.push(...ops.map(([type,amount,categoryId,note,offset])=>({id:id(),type,amount,date:mk(offset),note,accountId:a.id,categoryId,toAccountId:'',goalId:'',recurringId:''})));db.budgets.push({id:id(),categoryId:'c-groceries',limit:18000},{id:id(),categoryId:'c-transport',limit:7500},{id:id(),categoryId:'c-leisure',limit:10000});const g={id:id(),name:'Путешествие',target:160000,deadline:localDate(new Date(Date.now()+180*86400000)),emoji:'✈️',color:COLORS[0],archived:false};db.goals.push(g);db.transactions.push({id:id(),type:'goalAdd',amount:18000,date:today,note:'На отпуск',accountId:a.id,categoryId:'',toAccountId:'',goalId:g.id,recurringId:''});db.recurring.push({id:id(),title:'Музыка',type:'expense',amount:399,categoryId:'c-leisure',accountId:a.id,interval:'monthly',nextDate:today,anchorDay:Number(today.slice(8)),active:true});commit('Демоданные добавлены')}
function resetAll(){if(!confirm('ВНИМАНИЕ: удалить все счета, операции, цели, категории и планы? Сделайте резервную копию перед удалением.'))return;if(!confirm('Это действие нельзя отменить. Подтвердить полную очистку?'))return;db=defaults();storageError='';try{localStorage.removeItem(DB_KEY)}catch(e){toast('Не удалось очистить хранилище')}ui.month=monthKey();ui.planTab='budgets';closeModal();goTab('home');toast('Дневник очищен')}
window.addEventListener('storage',e=>{if(e.key===DB_KEY&&e.newValue){try{db=validateDb(JSON.parse(e.newValue));render();toast('Данные обновлены в другой вкладке')}catch(_){}}});
const OFFLINE_CACHE = 'list-finances-shell-v4-20261123';
async function prepareOffline(retry=false){
  if(location.protocol==='file:'){setOfflineStatus('Офлайн-файл','Эта копия HTML открывается без сети. Для установки PWA нужен HTTPS.');return;}
  if(location.protocol!=='https:'||!('serviceWorker' in navigator)||!('caches' in window)){
    setOfflineStatus('Не поддерживается','Для автономного запуска откройте HTTPS-версию в Safari.');return;
  }
  setOfflineStatus('Подготовка офлайн-режима…','Сохраняем файл приложения. Не закрывайте экран до завершения.');
  try{
    const reg=await navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'});
    if(retry) await reg.update();
    const appURL=new URL('./index.html',location.href).href;
    const isCached=async()=>{const cache=await caches.open(OFFLINE_CACHE);return Boolean(await cache.match(appURL));};
    if(!(await isCached())){
      if(reg.installing){
        await new Promise(resolve=>{const worker=reg.installing;if(worker.state==='activated'||worker.state==='redundant'){resolve();return;}const timeout=setTimeout(resolve,16000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'||worker.state==='redundant'){clearTimeout(timeout);resolve();}});});
      }
    }
    if(await isCached()){
      setOfflineStatus('Готово для офлайна','Приложение сохранено на устройстве. Можно отключить интернет и проверить запуск с иконки.');
    }else{
      setOfflineStatus('Не удалось сохранить','При включённом интернете нажмите «Проверить». Убедитесь, что открываете страницу в Safari.');
    }
  }catch(err){setOfflineStatus('Офлайн-режим недоступен','Ошибка установки кэша: '+String(err?.message||err).slice(0,90));}
}
window.addEventListener('load',()=>prepareOffline());

render();
